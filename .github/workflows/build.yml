# Build the larch-os kernel packages and publish them as a GitHub release.
#
# Manual only (Actions → Build kernel → Run workflow). The release tag is
# <Debian linux-source version>.larch<CFG_REV>, e.g. 6.12.113-1.larch1; if that
# release already exists the build is skipped unless "force" is ticked.
# larch-os downloads the .debs from the latest release (scripts/fetch-kernel.sh).
name: Build kernel

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and replace the release even if it already exists
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    # A full Debian config takes a few hours on a hosted runner; 6 h is the cap.
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the release tag
        id: tag
        run: |
          tag=$(docker run --rm -v "$PWD:/src" -w /src debian:trixie \
                sh -c 'apt-get update -qq >/dev/null && ./build-kernel.sh --tag')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Release $tag already exists"
          else
              echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.tag.outputs.exists == 'false' || inputs.force
        run: |
          # The build tree needs ~15 GB; the hosted image ships tens of GB of
          # SDKs this job never uses.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost
          df -h / /mnt

      - name: Build
        if: steps.tag.outputs.exists == 'false' || inputs.force
        run: |
          # Build tree on the runner's scratch disk (/mnt), output in the checkout.
          sudo mkdir -p /mnt/kbuild
          docker run --rm -v "$PWD:/src" -v /mnt/kbuild:/kbuild -w /src \
              -e KBUILD_DIR=/kbuild debian:trixie \
              sh -c './install-deps.sh && ./build-kernel.sh /src/out'
          [ "$(cat out/RELEASE)" = "${{ steps.tag.outputs.tag }}" ]

      - name: Publish release
        if: steps.tag.outputs.exists == 'false' || inputs.force
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" out/*.deb out/config \
              --title "larch kernel $tag" \
              --notes "Debian linux-source $(echo "$tag" | sed 's/\.larch[0-9]*$//') rebuilt with ext4, NVMe, SATA/AHCI, SCSI disk and virtio-blk built in (no initramfs needed). \`config\` is the full kernel config."
